<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pendaftar - KAWANUA Inline Skate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            width: 100%;
            max-width: 900px; /* Dibuat lebih lebar agar tabel muat */
            margin: 0 auto;
            position: relative;
            z-index: 2;
            padding: 20px 10px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            color: #1c2541;
            text-align: left;
        }

        th {
            background: rgba(28, 37, 65, 0.85);
            color: #ffffff;
            padding: 12px 10px;
            font-weight: 700;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.35);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.6);
        }

        .badge-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .status-transfer {
            background: #dcfce7;
            color: #166534;
        }

        .status-coach {
            background: #e0f2fe;
            color: #0369a1;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
        }

        .clear-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="bg-gradient-overlay"></div>

    <div class="admin-container">
        <!-- Header Dashboard -->
        <header class="header">
            <h1 class="brand-title">DAFTAR PENDAFTAR MASUK</h1>
            <p class="brand-tagline">KAWANUA Inline Skate School - Admin Dashboard</p>
        </header>

        <!-- Card Rekap Data (Glassmorphism Bening) -->
        <div class="price-cards-container">
            <div class="action-bar">
                <span style="font-size: 0.88rem; font-weight: 700; color: #1c2541;">
                    Total Pendaftar: <strong id="totalCount" style="color: #ff5722;">0</strong>
                </span>
                <button class="clear-btn" onclick="clearData()">🗑️ Hapus Semua Data</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Nama Murid</th>
                            <th>Kategori / Usia</th>
                            <th>No. WA</th>
                            <th>Paket & Coach</th>
                            <th>Metode Bayar</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="registrationTableBody">
                        <!-- Data otomatis dimasukkan melalui JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="footer" style="margin-top: 20px;">
            <p>&copy; 2026 KAWANUA Inline Skate School Admin</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadRegistrations);

        function loadRegistrations() {
            const tableBody = document.getElementById('registrationTableBody');
            const totalCount = document.getElementById('totalCount');

            // Ambil daftar histori pendaftaran dari localStorage
            const registrations = JSON.parse(localStorage.getItem('kawanuaAllRegistrations')) || [];

            totalCount.innerText = registrations.length;
            tableBody.innerHTML = '';

            if (registrations.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 20px; color: #64748b;">
                            Belum ada pendaftar baru yang masuk.
                        </td>
                    </tr>`;
                return;
            }

            registrations.forEach(item => {
                const badgeClass = item.metodePembayaran.includes('Transfer') ? 'status-transfer' : 'status-coach';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="white-space: nowrap;">${item.tanggal}</td>
                    <td><strong>${item.nama}</strong></td>
                    <td>${item.kategori} (${item.usia} Thn)<br><small>Wali: ${item.namaWali}</small></td>
                    <td><a href="https://wa.me/${item.phone}" target="_blank" style="color: #0284c7; font-weight: 600; text-decoration: none;">${item.phone} 💬</a></td>
                    <td>${item.paket}<br><small>Coach: ${item.coach}</small></td>
                    <td><span class="badge-status ${badgeClass}">${item.metodePembayaran}</span></td>
                    <td><strong>Rp ${item.total}</strong></td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Fungsi Reset/Hapus Data Rekap
        function clearData() {
            if (confirm("Apakah Anda yakin ingin menghapus seluruh rekap histori pendaftar?")) {
                localStorage.removeItem('kawanuaAllRegistrations');
                loadRegistrations();
            }
        }
    </script>
</body>
</html>
