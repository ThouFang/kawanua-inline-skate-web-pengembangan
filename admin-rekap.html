<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pendaftaran - Admin KAWANUA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(14px) !important;
            padding: 20px;
            border-radius: 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15) !important;
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            color: #1c2541;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: rgba(28, 37, 65, 0.1);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            font-style: italic;
            padding: 20px 0;
        }

        .badge-nim {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 700;
            color: #2563eb;
        }

        .badge-pass {
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 700;
            color: #d97706;
        }
    </style>
</head>
<body>

    <div class="bg-gradient-overlay"></div>

    <div class="main-container">
        <header class="header">
            <h1 class="brand-title">PANEL ADMIN</h1>
            <p class="brand-tagline">Rekap Pendaftaran Murid Baru</p>
        </header>

        <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="font-size: 1rem; color: #1c2541; margin: 0;">📋 Daftar Murid Terdaftar</h3>
                <button onclick="clearData()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer;">Hapus Semua Data</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Nama Murid</th>
                            <th>No. WhatsApp</th>
                            <th>Paket</th>
                            <th>NIM/Username</th>
                            <th>Password</th>
                        </tr>
                    </thead>
                    <tbody id="rekapTableBody">
                        <!-- Data otomatis diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <button onclick="logoutAdmin()" class="btn-primary" style="border: none; width: 100%; background: #475569 !important;">
            <span class="btn-icon">🚪</span>
            <div class="btn-text">
                <strong>Keluar (Logout Admin)</strong>
            </div>
        </button>

        <footer class="footer" style="margin-top: 20px;">
            <p>&copy; 2026 KAWANUA Inline Skate School</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Proteksi Akses Admin
            const session = JSON.parse(localStorage.getItem('kawanuaUserSession'));
            if (!session || session.role !== 'admin') {
                alert('Akses Ditolak! Anda harus login sebagai Admin.');
                window.location.href = 'login.html';
                return;
            }

            // 2. Muat Data Pendaftaran
            loadRegistrations();
        });

        function loadRegistrations() {
            const tableBody = document.getElementById('rekapTableBody');
            const registrations = JSON.parse(localStorage.getItem('kawanuaRegistrations')) || [];

            if (registrations.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">Belum ada murid yang mendaftar.</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = '';
            registrations.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.tanggal || '-'}</td>
                    <td><strong>${item.nama}</strong></td>
                    <td><a href="https://wa.me/${item.hp}" target="_blank" style="color: #16a34a; font-weight:600; text-decoration:none;">${item.hp} 💬</a></td>
                    <td>${item.paket}</td>
                    <td><span class="badge-nim">${item.nim}</span></td>
                    <td><span class="badge-pass">${item.pass}</span></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function clearData() {
            if (confirm('Apakah Anda yakin ingin menghapus seluruh rekap pendaftaran murid?')) {
                localStorage.removeItem('kawanuaRegistrations');
                localStorage.removeItem('kawanuaStudentsDB');
                loadRegistrations();
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('kawanuaUserSession');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
