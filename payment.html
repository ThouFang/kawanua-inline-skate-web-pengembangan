<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Latihan - KAWANUA Inline Skate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-gradient-overlay"></div>

    <div class="main-container">
        <!-- Header Ringkasan Pembayaran -->
        <header class="header">
            <h1 class="brand-title">PEMBAYARAN LATIHAN</h1>
            <p class="brand-tagline">KAWANUA Inline Skate School</p>
        </header>

        <!-- Card Transaksi (Glassmorphism 3D Bening) -->
        <div class="price-cards-container" style="text-align: left;">
            <h2 class="price-list-title" style="text-align: center; border-bottom: 1px solid rgba(255,255,255,0.6); padding-bottom: 10px; margin-bottom: 16px;">
                📋 Ringkasan Pendaftaran
            </h2>

            <div style="display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; color: #1c2541; margin-bottom: 20px;">
                <p><strong>Nama Murid:</strong> <span id="summaryName">-</span></p>
                <p><strong>No. WhatsApp:</strong> <span id="summaryPhone">-</span></p>
                <p><strong>Paket Latihan:</strong> <span id="summaryPackage">-</span></p>
                <p><strong>Lokasi Latihan:</strong> <span id="summaryLocation">-</span></p>
                <div class="separator"></div>
                <p style="font-size: 1.05rem; font-weight: 800; color: #d84315; display: flex; justify-content: space-between;">
                    <span>Total Pembayaran:</span>
                    <span id="summaryTotal">Rp 0</span>
                </p>
            </div>

            <h3 style="font-size: 0.95rem; text-align: center; margin-bottom: 12px; color: #1c2541;">Scan QRIS / Transfer Pembayaran:</h3>
            
            <!-- Tempat Kode QRIS / Rekening Bank -->
            <div style="background: rgba(255,255,255,0.9); padding: 16px; border-radius: 16px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.1);">
                <!-- Ganti assets/qris.png dengan gambar QRIS Anda -->
                <img src="assets/qris.png" alt="QRIS Kawanua Inline Skate" style="max-width: 220px; width: 100%; height: auto; border-radius: 12px; margin-bottom: 8px;">
                <p style="font-size: 0.78rem; color: #64748b; font-weight: 600;">Atas Nama: KAWANUA INLINE SKATE</p>
            </div>

            <!-- Tombol Otomatis ke WA -->
            <button id="btnCompletePayment" class="btn-primary" style="border: none; width: 100%;">
                <span class="btn-icon">✅</span>
                <div class="btn-text">
                    <strong>Konfirmasi & Chat Admin WA</strong>
                    <small>Otomatis kirim detail pendaftaran</small>
                </div>
            </button>
        </div>

        <footer class="footer">
            <p>&copy; 2026 KAWANUA Inline Skate School</p>
        </footer>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Ambil data pendaftaran dari localStorage
        const bookingData = JSON.parse(localStorage.getItem('kawanuaBookingData')) || {
            nama: 'Calon Murid',
            phone: '-',
            paket: 'Private Class',
            jadwal: 'Godbless Park',
            total: '175.000',
            kategori: 'Anak-anak',
            coach: 'Coach'
        };

        // Isi tampilan ringkasan transaksi
        document.getElementById('summaryName').innerText = bookingData.nama;
        document.getElementById('summaryPhone').innerText = bookingData.phone;
        document.getElementById('summaryPackage').innerText = bookingData.paket;
        document.getElementById('summaryLocation').innerText = bookingData.jadwal;
        document.getElementById('summaryTotal').innerText = 'Rp ' + bookingData.total;

        // Ganti dengan Nomor Admin WA Kawanua
        const adminPhoneNumber = "6281919208099"; 

        document.getElementById('btnCompletePayment').addEventListener('click', () => {
            let guardianText = bookingData.kategori === "Anak-anak" 
                ? `• Nama Wali/Orang Tua: *${bookingData.namaWali}*\n• WA Wali: *${bookingData.phone}*`
                : `• WA Peserta: *${bookingData.phone}*`;

            const waMessage = 
`*PENDATAAN & PEMBAYARAN LES PRIVATE*
*KAWANUA INLINE SKATE SCHOOL*
--------------------------------------------
*1. DATA MURID*
• Nama Murid: *${bookingData.nama}*
• Usia: *${bookingData.usia} Tahun*
• Kategori: *${bookingData.kategori}*
${guardianText}

*2. PENDATAAN LATIHAN*
• Tingkat Kemampuan: *${bookingData.skill}*
• Status Alat: *${bookingData.alat}*
• Paket Latihan: *${bookingData.paket}*
• Pilihan Coach: *${bookingData.coach}*
• Rencana Jadwal/Lokasi: *${bookingData.jadwal}*

--------------------------------------------
💳 *STATUS PEMBAYARAN:*
• Total: *Rp ${bookingData.total}*
• Status: *Sudah Transfer / Lunas*
--------------------------------------------
Berikut saya sertakan lampiran bukti transfer pembayaran. Terima kasih Admin!`;

            // Buka WhatsApp Admin
            window.location.href = `https://wa.me/${adminPhoneNumber}?text=${encodeURIComponent(waMessage)}`;
        });
    });
</script>
</body>
</html>
